# Publish axorn to PyPI and npm when a version tag (v0.1.1, …) is pushed.
# Both registries use trusted publishing (OIDC), so no tokens live in the repo.
# The tests run first, and the tag must match the version in both
# pyproject.toml and package.json, so a mistyped tag can't ship. Each
# registry skips a version it already has, so re-runs are safe.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Tag matches both package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          js=$(node -p "require('./package.json').version")
          echo "tag=$tag pyproject=$py package.json=$js"
          test "$tag" = "$py" && test "$tag" = "$js"
      - run: python3 tests/test_cases.py

  pypi:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true # a re-run after a partial failure stays green

  npm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      # Skip a version that's already on npm (e.g. 0.1.0, published by hand
      # because trusted publishing needs the package to exist first).
      - name: Publish unless this version is already on npm
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "axorn@$v" version >/dev/null 2>&1; then
            echo "axorn@$v is already on npm; skipping."
          else
            npm publish --access public
          fi
