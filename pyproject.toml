[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axorn"
version = "0.1.0"
description = "Pāli script converter, roman ↔ Thai, for Python and JS from one shared table"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"

[project.urls]
Repository = "https://github.com/korakot/axorn"

[tool.setuptools]
packages = ["axorn"]

[tool.setuptools.package-data]
axorn = ["thai.json"]
